<style>

/* =========================================================
   FONT
   ========================================================= */

@font-face{

/* =========================================================
   ROOT
   ========================================================= */

    --orange2:#ff9d00;
    --yellow:#ffd000;

    --black:#050505;
    --black2:#090909;

    --border:

}


/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
}


html,
body,
button,
input,
select,
textarea,
option,
a,
div,
span,
p,
h1,
h2,
h3,
h4,
h5,
h6,
strong,
b,
small,
label,
time{

    font-weight:700 !important;

}


html{
    scroll-behavior:smooth;
}


body{

    margin:0;

    min-height:100vh;

    color:#fff;

    background:

        radial-gradient(

            rgba(255,106,0,.10),
            transparent 30%
        ),

            circle at 90% 15%,
            rgba(255,157,0,.07),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #030303,
            #080808 50%,
            #030303
        );

    overflow-x:hidden;

}


button,
input,
select,
textarea{

}


button{

}


::-webkit-scrollbar{

    width:6px;
    height:6px;

}


::-webkit-scrollbar-track{
    background:#050505;
}


::-webkit-scrollbar-thumb{

            180deg,

            var(--orange2)

    border-radius:50px;

}


/* =========================================================
   HEADER
   ========================================================= */

header{

    position:sticky;

    top:0;

    z-index:5000;

    background:

    backdrop-filter:

    border-bottom:

}


.header-inner{

            calc(100% - 24px)

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

}


.brand{

    display:flex;

    align-items:center;

    gap:10px;

    min-width:0;

}


.brand img{

    width:42px;

    height:42px;

    object-fit:cover;

    border-radius:11px;

    border:
        1px solid
        rgba(255,106,0,.35);

}


.brand-name{

    font-size:14px;

    white-space:nowrap;

}


.nav{

    display:flex;

    align-items:center;

    gap:5px;

}


.nav a{

    color:#aaa;

    text-decoration:none;

    font-size:11px;

    padding:10px 12px;

    border-radius:9px;

    transition:.2s;

}


.nav a:hover{

    color:#fff;

    background:
        rgba(255,106,0,.09);

}


.menu-btn{

    display:none;

    width:40px;

    height:40px;

    border-radius:10px;

    border:
        1px solid
        var(--border);

    background:#111;

    color:#fff;

    cursor:pointer;

    font-size:18px;

}


/* =========================================================
   HERO
   ========================================================= */

.hero{

    width:
        min(
            1200px,
            calc(100% - 24px)
        );

    margin:
        26px auto 18px;

}


.hero-box{

    position:relative;

    overflow:hidden;

    padding:30px 24px;

    border-radius:21px;

    border:
        1px solid
        var(--border);

    background:

        radial-gradient(
            circle at 90% 10%,
            rgba(255,106,0,.15),

        linear-gradient(
            135deg,
            rgba(255,106,0,.06),
            rgba(255,255,255,.02)
        );

}


.hero-title{

    margin:0;

    font-size:
        clamp(
            28px,
            6vw,
            55px
        );

    line-height:1.05;

}


.hero-title span{
    color:var(--orange);
}


.hero-subtitle{

    margin:
        13px 0 0;

    color:#888;

    font-size:12px;

}


/* =========================================================
   CONTROLS
   ========================================================= */

.controls{

    width:
        min(
            1200px,
            calc(100% - 24px)
        );

    margin:auto;

    display:grid;

    grid-template-columns:
        220px 1fr;

    gap:10px;

}


.server-select,

    border-radius:11px;

    border:
        1px solid

    color:#fff;

}


.server-select:focus,
.search-input:focus{

    box-shadow:

}


.server-select option{

    background:#111;

/* =========================================================
   FILTER
   ========================================================= */

.filter-btn{

}


.filter-btn.active{

/* =========================================================
   INFO

.info-bar{

.info-item{

}


#syncStatus{

/* =========================================================

main{

.events-grid{

/* =========================================================
   EVENT CARD
   ========================================================= */

    border-radius:16px;

}


.event-image-wrap{

    position:relative;

    aspect-ratio:16/9;

    overflow:hidden;

}


.event-image{

    display:block;

    width:100%;

    height:100%;

    object-fit:cover;

}


.image-overlay{

    position:absolute;

    inset:0;

    pointer-events:none;

            rgba(0,0,0,.05),

   STATUS

.event-status.upcoming{

.event-meta{

.meta-value{

}


/* =========================================================

.countdown{

    color:#ffac4a;

    background:
        rgba(255,106,0,.055);

        1px solid
        rgba(255,106,0,.09);

    font-size:10px;

}


/* =========================================================
   MESSAGE

.message{

/* =========================================================
   FOOTER

footer{

.footer-text{

/* =========================================================
   TOAST
   ========================================================= */

.toast{

    position:fixed;

    left:50%;

    bottom:22px;

    z-index:99999;

    padding:10px 14px;

    border-radius:9px;

    background:#151515;

    border:
        1px solid
        rgba(255,106,0,.3);

    color:#fff;

    font-size:10px;

    opacity:0;

    transform:
        translate(-50%,20px);

    pointer-events:none;

    transition:.22s;

}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:850px){

    .nav{
        display:none;

    .menu-btn{

    }


    .controls{

            180px 1fr;

    }

        grid-template-columns:
            repeat(
                2,

@media(max-width:600px){

            24px 18px;

    }

        font-size:30px;
    }


    .brand-name{
        font-size:12px;
    }

}

};


/* =========================================================
   STATE
   ========================================================= */

const state = {

    server:
        localStorage.getItem(
            CONFIG.STORAGE_KEY
        ) || "vn",

    events:[],

    filter:"all",

    search:"",

    loading:false,

    lastDataSignature:""

};


/* =========================================================
   DOM
   ========================================================= */

const serverSelect =
    document.getElementById(
        "serverSelect"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const eventsGrid =
    document.getElementById(
        "eventsGrid"
    );


const eventCount =
    document.getElementById(
        "eventCount"
    );


const serverName =
    document.getElementById(
        "serverName"
    );


const syncStatus =
    document.getElementById(
        "syncStatus"
    );


const toast =
    document.getElementById(
        "toast"
    );


serverSelect.value =
    state.server;


/* =========================================================
   SERVER NAMES
   ========================================================= */

const SERVER_NAMES = {

    vn:"VN",
    th:"TH",
    id:"ID",
    sg:"SG",
    my:"MY",
    ph:"PH",
    br:"BR",
    in:"IN",
    pk:"PK",
    bd:"BD",
    eg:"EG"

};


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   DATE PARSER
   ========================================================= */

function parseDate(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return null;

    }


    if(
        value instanceof Date
    ){

        return isNaN(
            value.getTime()
        )
            ? null
            : value;

    }


    if(
        typeof value === "number" ||
        (
            typeof value === "string" &&
            /^\d{10,13}$/.test(
                value.trim()
            )
        )
    ){

        let timestamp =
            Number(value);


        if(
            String(
                Math.abs(timestamp)
            ).length <= 10
        ){

            timestamp *= 1000;

        }


        const unixDate =
            new Date(timestamp);


        if(
            !isNaN(
                unixDate.getTime()
            )
        ){

            return unixDate;

        }

    }


    const text =
        String(value).trim();


    let date =
        new Date(text);


    if(
        !isNaN(
            date.getTime()
        )
    ){

        return date;

    }


    let match =
        text.match(
            /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
        );


    if(match){

        date =
            new Date(

                Number(match[1]),

                Number(match[2]) - 1,

                Number(match[3]),

                Number(match[4] || 0),

                Number(match[5] || 0),

                Number(match[6] || 0)

            );


        if(
            !isNaN(
                date.getTime()
            )
        ){

            return date;

        }

    }


    match =
        text.match(
            /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/
        );


    if(match){

        date =
            new Date(

                Number(match[3]),

                Number(match[2]) - 1,

                Number(match[1]),

                Number(match[4] || 0),

                Number(match[5] || 0),

                Number(match[6] || 0)

            );


        if(
            !isNaN(
                date.getTime()
            )
        ){

            return date;

        }

    }


    return null;

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(value){

    const date =
        parseDate(value);


    if(!date){

        return "--";

    }


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const year =
        date.getFullYear();


    const hours =
        String(
            date.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            date.getMinutes()
        ).padStart(
            2,
            "0"
        );


    return (

        day +
        "/" +
        month +
        "/" +
        year +
        " " +
        hours +
        ":" +
        minutes

    );

}


/* =========================================================
   FIND EVENT ARRAY
   ========================================================= */

function findEventArray(data){

    if(!data){

        return [];

    }


    if(
        Array.isArray(data)
    ){

        return data;

    }


    if(
        Array.isArray(data.events)
    ){

        return data.events;

    }


    if(
        data.data &&
        Array.isArray(
            data.data.events
        )
    ){

        return data.data.events;

    }


    if(
        data.data &&
        Array.isArray(
            data.data
        )
    ){

        return data.data;

    }


    if(
        data.result &&
        Array.isArray(
            data.result.events
        )
    ){

        return data.result.events;

    }


    if(
        data.result &&
        Array.isArray(
            data.result
        )
    ){

        return data.result;

    }


    return [];

}


/* =========================================================
   NORMALIZE
   ========================================================= */

function normalizeEvent(
    event,
    index
){

    event =
        event || {};


    return {

        id:
            event.id ??
            event.event_id ??
            event.eventId ??
            index,


        title:
            event.title ??
            event.name ??
            event.event_name ??
            "Sự kiện Free Fire",


        banner:
            event.banner ??
            event.image ??
            event.img ??
            event.thumbnail ??
            CONFIG.DEFAULT_IMAGE,


        start:
            event.start ??
            event.start_time ??
            event.startTime ??
            event.begin ??
            event.begin_time ??
            event.beginTime ??
            event.startDate ??
            event.start_date ??
            "",


        end:
            event.end ??
            event.end_time ??
            event.endTime ??
            event.finish ??
            event.finish_time ??
            event.finishTime ??
            event.endDate ??
            event.end_date ??
            "",


        link:
            event.link ??
            event.url ??
            "",


        type:
            event.type ??
            "",


        description:
            event.description ??
            event.desc ??
            event.content ??
            "",


        raw:event

    };

}


/* =========================================================
   SIGNATURE
   ========================================================= */

function createSignature(events){

    try{

        return JSON.stringify(

            events.map(
                event => ({

                    id:event.id,

                    title:event.title,

                    banner:event.banner,

                    start:event.start,

                    end:event.end,

                    link:event.link,

                    type:event.type,

                    description:
                        event.description

                })
            )

        );

    }catch{

        return "";

    }

}


/* =========================================================
   STATUS
   ========================================================= */

function getStatus(event){

    const now =
        Date.now();


    const start =
        parseDate(
            event.start
        );


    const end =
        parseDate(
            event.end
        );


    if(
        start &&
        now <
        start.getTime()
    ){

        return "upcoming";

    }


    if(
        end &&
        now >
        end.getTime()
    ){

        return "ended";

    }


    return "live";

}


function getStatusText(status){

    if(
        status === "live"
    ){

        return "ĐANG DIỄN RA";

    }


    if(
        status === "upcoming"
    ){

        return "SẮP DIỄN RA";

    }


    return "ĐÃ KẾT THÚC";

}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function getCountdown(event){

    const status =
        getStatus(event);


    const target =
        status === "upcoming"

            ? parseDate(
                event.start
            )

            : parseDate(
                event.end
            );


    if(!target){

        return "THỜI GIAN CHƯA XÁC ĐỊNH";

    }


    const difference =
        target.getTime() -
        Date.now();


    if(
        difference <= 0
    ){

        return status === "upcoming"

            ? "ĐANG DIỄN RA"

            : "ĐÃ KẾT THÚC";

    }


    let seconds =
        Math.floor(
            difference / 1000
        );


    const days =
        Math.floor(
            seconds / 86400
        );


    seconds %= 86400;


    const hours =
        Math.floor(
            seconds / 3600
        );


    seconds %= 3600;


    const minutes =
        Math.floor(
            seconds / 60
        );


    seconds %= 60;


    return (

        days +
        " NGÀY " +

        String(hours)
            .padStart(2,"0") +

        ":" +

        String(minutes)
            .padStart(2,"0") +

        ":" +

        String(seconds)
            .padStart(2,"0")

    );

}


/* =========================================================
   VQ
   ========================================================= */

const VQ_MAP = {

    TW:"VQTO",

    FW:"VQBM",

    DW:"VQKB",

    TG:"VQMM",

    LW:"BXNP",

    MS:"SHB"

};


function detectVQ(event){

    const raw =
        event.raw || {};


    const text = [

        event.title,

        event.type,

        raw.title,

        raw.type,

        raw.code,

        raw.id,

        raw.event_id,

        raw.eventId,

        raw.name

    ]

    .filter(Boolean)

    .join(" ")

    .toUpperCase();


    for(
        const prefix in VQ_MAP
    ){

        const regex =
            new RegExp(

                "\\b" +
                prefix +
                "(10|[1-9])\\b"

            );


        const match =
            text.match(
                regex
            );


        if(match){

            return (

                VQ_MAP[prefix] +
                match[1]

            );

        }

    }


    return "";

}


/* =========================================================
   CACHE
   ========================================================= */

function getCacheKey(server){

    return (

        CONFIG.CACHE_PREFIX +
        server

    );

}


function saveCache(
    server,
    events
){

    try{

        localStorage.setItem(

            getCacheKey(server),

            JSON.stringify({

                time:
                    Date.now(),

                events:
                    events

            })

        );

    }catch{}

}


function readCache(server){

    try{

        const value =
            localStorage.getItem(
                getCacheKey(server)
            );


        if(!value){

            return null;

        }


        const data =
            JSON.parse(
                value
            );


        if(

            !data ||

            !Array.isArray(
                data.events
            )

        ){

            return null;

        }


        return data;

    }catch{

        return null;

    }

}


/* =========================================================
   API
   ========================================================= */

async function fetchAPI(server){

    const controller =
        new AbortController();


    const timeout =
        setTimeout(

            () =>
                controller.abort(),

            CONFIG.TIMEOUT

        );


    try{

        const url =

            CONFIG.API +

            encodeURIComponent(
                server
            ) +

            "&_t=" +

            Date.now();


        const response =

            await fetch(

                url,

                {

                    method:"GET",

                    cache:"no-store",

                    signal:
                        controller.signal,

                    headers:{

                        "Accept":
                            "application/json",

                        "Cache-Control":
                            "no-cache"

                    }

                }

            );


        if(
            !response.ok
        ){

            throw new Error(

                "HTTP " +
                response.status

            );

        }


        return await response.json();


    }finally{

        clearTimeout(
            timeout
        );

    }

}


/* =========================================================
   VISIBLE EVENTS
   ========================================================= */

function getVisibleEvents(){

    let events =
        [...state.events];


    if(
        state.filter !== "all"
    ){

        events =
            events.filter(

                event =>

                    getStatus(event) ===
                    state.filter

            );

    }


    const search =
        state.search
            .trim()
            .toLowerCase();


    if(search){

        events =
            events.filter(

                event => {

                    const text = [

                        event.title,

                        event.description,

                        event.type

                    ]

                    .join(" ")

                    .toLowerCase();


                    return text.includes(
                        search
                    );

                }

            );

    }


    return events;

}

/* =========================================================
   COUNTDOWN LOOP
   ========================================================= */

function updateCountdowns(){

    document
        .querySelectorAll(
            "[data-countdown-id]"
        )

        .forEach(

            element => {

                const id =
                    element.dataset.countdownId;


                const event =
                    state.events.find(

                        item =>

                            String(item.id) ===
                            String(id)

                    );


                if(!event){

                    return;

                }


                const text =
                    getCountdown(event);


                if(
                    element.textContent !==
                    text
                ){

                    element.textContent =
                        text;

                }


                const card =
                    element.closest(
                        ".event-card"
                    );


                if(!card){

                    return;

                }


                const statusElement =
                    card.querySelector(
                        ".event-status"
                    );


                if(!statusElement){

                    return;

                }


                const status =
                    getStatus(event);


                const className =
                    "event-status " +
                    status;


                if(
                    statusElement.className !==
                    className
                ){

                    statusElement.className =
                        className;


                    statusElement.textContent =
                        getStatusText(
                            status
                        );

                }

            }

        );

}


setInterval(
    updateCountdowns,
    1000
);


/* =========================================================
   SYNC STATUS
   ========================================================= */

function setSyncStatus(
    text,
    color
){

    syncStatus.textContent =
        text;


    syncStatus.style.color =
        color;

}


/* =========================================================
   FAST LOAD SERVER
   ========================================================= */

async function loadServer(
    server,
    initial = false
){

    if(state.loading){

        return;

    }


    state.loading =
        true;


    /*
     * 0ms:
     * ĐANG KẾT NỐI
     */

    setSyncStatus(

        "ĐANG KẾT NỐI",

        "#ffad45"

    );


    /*
     * CACHE:
     * Hiển thị ngay lập tức
     */

    const cached =
        readCache(server);


    if(cached){

        const cachedEvents =

            cached.events.map(
                normalizeEvent
            );


        if(
            state.events.length === 0
        ){

            state.events =
                cachedEvents;


            state.lastDataSignature =

                createSignature(
                    cachedEvents
                );


            renderEvents();

        }

    }


    /*
     * API
     */

    try{

        const data =
            await fetchAPI(
                server
            );


        /*
         * Bỏ response cũ nếu
         * người dùng đổi server.
         */

        if(
            server !==
            state.server
        ){

            return;

        }


        const rawEvents =
            findEventArray(data);


        const events =
            rawEvents.map(
                normalizeEvent
            );


        const signature =
            createSignature(
                events
            );


        if(
            signature !==
            state.lastDataSignature
        ){

            state.events =
                events;


            state.lastDataSignature =
                signature;


            renderEvents();

        }


        saveCache(
            server,
            events
        );


        /*
         * Thành công thật:
         * chuyển trạng thái NGAY.
         */

        setSyncStatus(

            "ĐÃ ĐỒNG BỘ",

            "#20df72"

        );


    }catch(error){

        console.error(
            "API ERROR:",
            error
        );


        /*
         * Có dữ liệu cache:
         * giữ trạng thái ổn định.
         */

        if(
            state.events.length > 0
        ){

            setSyncStatus(

                "ĐÃ ĐỒNG BỘ",

                "#20df72"

            );

        }else{

            setSyncStatus(

                "CHỜ KẾT NỐI",

                "#ff9b45"

            );


            eventsGrid.innerHTML = `

                <div class="message">

                    <div class="message-icon">
                        ⚠️
                    </div>

                    <div class="message-title">
                        ĐANG CẬP NHẬT
                    </div>

                    <div class="message-text">
                        Chưa thể tải dữ liệu sự kiện.
                    </div>

                </div>

            `;

        }

    }finally{

        state.loading =
            false;

    }

}

/* =========================================================
   COPY BANNER
   ========================================================= */

document.addEventListener(

    "click",

    async event => {

        const button =
            event.target.closest(
                ".copy-banner"
            );


        if(!button){

            return;

        }


        const url =
            decodeURIComponent(
                button.dataset.banner || ""
            );


        if(!url){

            showToast(
                "KHÔNG CÓ LINK BANNER"
            );

            return;

        }


        try{

            await navigator.clipboard.writeText(
                url
            );


            showToast(
                "ĐÃ SAO CHÉP LINK BANNER"
            );

        }catch{

            try{

                const textarea =
                    document.createElement(
                        "textarea"
                    );


                textarea.value =
                    url;


                textarea.style.position =
                    "fixed";


                textarea.style.opacity =
                    "0";


                document.body.appendChild(
                    textarea
                );


                textarea.select();


                document.execCommand(
                    "copy"
                );


                textarea.remove();


                showToast(
                    "ĐÃ SAO CHÉP LINK BANNER"
                );

            }catch{

                showToast(
                    "KHÔNG THỂ SAO CHÉP"
                );

            }

        }

    }

);

        toastTimer

    toastTimer =
        setTimeout(

            () => {

                toast.classList.remove(

            2200

        );

}
