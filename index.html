<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FREE FIRE EVENT & UPDATE 🔥</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(100% - 24px,900px);
    margin:30px auto;
}

.event-card{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,106,0,.18);
    border-radius:18px;
    padding:14px;
    margin-bottom:14px;
    backdrop-filter:blur(12px);
}

.event-banner{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:13px;
    display:block;
}

.event-title{
    margin:12px 0 6px;
    font-size:17px;
    font-weight:800;
}

.event-desc{
    color:#aaa;
    font-size:13px;
    line-height:1.5;
}

.countdown{
    margin-top:10px;
    color:#ff9d3c;
    font-size:12px;
    font-weight:700;
}

/* NÚT SAO CHÉP NHỎ */
.copy-banner-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:auto;
    min-height:30px;
    margin-top:9px;
    padding:5px 9px;
    border:1px solid rgba(255,106,0,.25);
    border-radius:8px;
    background:rgba(255,106,0,.07);
    color:#ff9d3c;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.copy-banner-btn:hover{
    background:rgba(255,106,0,.16);
    border-color:rgba(255,106,0,.5);
}

.copy-banner-btn.copied{
    color:#35e58a;
    border-color:rgba(53,229,138,.3);
    background:rgba(53,229,138,.08);
}

.copy-banner-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.status{
    display:inline-block;
    margin-top:8px;
    padding:4px 8px;
    border-radius:7px;
    background:rgba(255,255,255,.07);
    color:#aaa;
    font-size:10px;
}
</style>
</head>

<body>

<div class="container">

    <h1>FREE FIRE EVENT & UPDATE 🔥</h1>

    <div id="events">
        Đang tải sự kiện...
    </div>

</div>

<script>
const API_URL = "/api/events?region=vn";

const DEFAULT_IMAGE =
"https://cdn.upanhlaylink.com/i/NuXM0SFQ.jpg";


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   LẤY LINK BANNER
========================= */

function getBanner(event){

    return (
        event.banner ||
        event.image ||
        event.image_url ||
        event.banner_url ||
        event.cover ||
        event.thumbnail ||
        ""
    );
}


/* =========================
   CHUẨN HÓA EVENT
========================= */

function normalizeEvent(event){

    return {
        title:
            event.title ||
            event.name ||
            "Sự kiện Free Fire",

        description:
            event.description ||
            event.desc ||
            "",

        banner:getBanner(event),

        start:
            event.start ||
            event.start_time ||
            event.startAt ||
            event.startDate ||
            null,

        end:
            event.end ||
            event.end_time ||
            event.endAt ||
            event.endDate ||
            null
    };
}


/* =========================
   ĐẾM NGƯỢC
========================= */

function countdown(end){

    if(!end) return "";

    const time =
        new Date(end).getTime() - Date.now();

    if(time <= 0)
        return "ĐÃ KẾT THÚC";

    const days =
        Math.floor(time / 86400000);

    const hours =
        Math.floor((time % 86400000) / 3600000);

    const minutes =
        Math.floor((time % 3600000) / 60000);

    const seconds =
        Math.floor((time % 60000) / 1000);

    return `⏳ Còn ${days} ngày ${hours} giờ ${minutes} phút ${seconds} giây`;
}


/* =========================
   HIỂN THỊ EVENT
========================= */

function renderEvents(data){

    const box =
        document.getElementById("events");

    let list =
        Array.isArray(data)
            ? data
            : data?.data ||
              data?.events ||
              [];

    if(!list.length){

        box.innerHTML =
            `<div class="event-card">
                Không có sự kiện.
            </div>`;

        return;
    }

    list =
        list.map(normalizeEvent);

    box.innerHTML =
        list.map((event,index)=>{

            const banner =
                event.banner;

            return `
            <article class="event-card">

                <img
                    class="event-banner"
                    src="${
                        escapeHTML(
                            banner || DEFAULT_IMAGE
                        )
                    }"
                    onerror="this.src='${DEFAULT_IMAGE}'"
                    alt="Free Fire Event"
                >

                <div class="event-title">
                    ${escapeHTML(event.title)}
                </div>

                ${
                    event.description
                    ? `<div class="event-desc">
                        ${escapeHTML(
                            event.description
                        )}
                       </div>`
                    : ""
                }

                ${
                    event.end
                    ? `<div
                        class="countdown"
                        data-end="${escapeHTML(event.end)}">
                        ${countdown(event.end)}
                       </div>`
                    : ""
                }

                ${
                    banner
                    ? `
                    <button
                        type="button"
                        class="copy-banner-btn"
                        data-banner="${escapeHTML(banner)}">
                        🔗 Sao chép
                    </button>
                    `
                    : `
                    <button
                        type="button"
                        class="copy-banner-btn"
                        disabled>
                        ⚠️ Chưa có banner
                    </button>
                    `
                }

            </article>
            `;

        }).join("");

    updateCountdowns();
}


/* =========================
   CẬP NHẬT COUNTDOWN
========================= */

function updateCountdowns(){

    document
        .querySelectorAll(".countdown")
        .forEach(el=>{

            el.textContent =
                countdown(
                    el.dataset.end
                );

        });
}


/* =========================
   SAO CHÉP LINK BANNER
========================= */

document.addEventListener(
    "click",
    async function(e){

        const button =
            e.target.closest(
                ".copy-banner-btn"
            );

        if(!button || button.disabled)
            return;

        const url =
            button.dataset.banner;

        if(!url)
            return;

        try{

            await navigator.clipboard
                .writeText(url);

            button.textContent =
                "✅ Đã sao chép";

            button.classList.add(
                "copied"
            );

            setTimeout(()=>{

                button.textContent =
                    "🔗 Sao chép";

                button.classList.remove(
                    "copied"
                );

            },1500);

        }catch(error){

            /* Fallback cho một số trình duyệt */

            try{

                const input =
                    document.createElement("input");

                input.value = url;

                document.body.appendChild(
                    input
                );

                input.select();

                document.execCommand(
                    "copy"
                );

                input.remove();

                button.textContent =
                    "✅ Đã sao chép";

                button.classList.add(
                    "copied"
                );

                setTimeout(()=>{

                    button.textContent =
                        "🔗 Sao chép";

                    button.classList.remove(
                        "copied"
                    );

                },1500);

            }catch{

                button.textContent =
                    "❌ Không thể sao chép";

                setTimeout(()=>{

                    button.textContent =
                        "🔗 Sao chép";

                },1500);

            }

        }

    }
);


/* =========================
   LOAD EVENTS
========================= */

async function loadEvents(){

    const box =
        document.getElementById("events");

    try{

        const response =
            await fetch(
                API_URL,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            throw new Error(
                "API Error"
            );

        const data =
            await response.json();

        renderEvents(data);

    }catch(error){

        console.error(error);

        box.innerHTML =
            `<div class="event-card">
                ❌ Không thể tải dữ liệu sự kiện.
            </div>`;

    }

}


/* =========================
   START
========================= */

loadEvents();

setInterval(
    updateCountdowns,
    1000
);

</script>

</body>
</html>
