<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131d">
  <title>FF Events — Event Center</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e16;--panel:#151a27;--line:#293247;--muted:#9aa6bd;--gold:#ffc857;--cyan:#42d9e8}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#26324b 0,transparent 35%),linear-gradient(135deg,#090c13,#111827);color:#f4f6fb;font:15px/1.5 system-ui,Arial,sans-serif;min-height:100vh}
    header{padding:28px 5vw 22px;border-bottom:1px solid #ffffff14;background:#080b12b8}
    .brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#f07828);display:grid;place-items:center;color:#151515;font-weight:1000;font-size:20px}
    h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.5px}header p{margin:5px 0 0;color:var(--muted)}
    main{width:min(1180px,92vw);margin:28px auto 60px}.toolbar,.panel{background:#111725e8;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 15px 45px #0005}
    .toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}.field label{display:block;color:#c8d0df;font-size:12px;font-weight:700;margin-bottom:7px;text-transform:uppercase;letter-spacing:.8px}
    select,input{width:100%;background:#0b101b;border:1px solid #34415b;border-radius:10px;color:white;padding:12px;font:inherit;outline:none}select:focus,input:focus{border-color:var(--cyan)}
    button{border:0;border-radius:10px;padding:12px 20px;font-weight:800;background:linear-gradient(135deg,var(--gold),#ff9c38);color:#17120a;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .status{margin:14px 2px;color:var(--muted);min-height:24px}.status.error{color:#ff8d8d}.status.ok{color:#8de7bd}
    .meta{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{border:1px solid var(--line);background:#151c2b;border-radius:99px;padding:6px 11px;color:#cbd4e5;font-size:12px}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 2px 14px}.section-title h2{font-size:19px;margin:0}.count{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:16px}.event{overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,#1a2233,#101522);border-radius:15px}
    .event img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20283a;display:block}.event-body{padding:13px}.event h3{font-size:15px;margin:0 0 8px}.event small{color:var(--muted)}.event a{display:inline-block;margin-top:10px;color:var(--gold);font-weight:700;text-decoration:none}
    .empty{padding:35px;text-align:center;border:1px dashed #3b4963;border-radius:14px;color:var(--muted);grid-column:1/-1}
    footer{text-align:center;color:#76839a;padding:24px;font-size:12px}
    @media(max-width:700px){.toolbar{grid-template-columns:1fr}.toolbar button{width:100%}header{padding:22px 4vw}}
  </style>
</head>
<body>
<header><div class="brand"><div class="logo">FF</div><div><h1>EVENT CENTER</h1><p>Theo dõi sự kiện và cập nhật Free Fire theo khu vực</p></div></div></header>
<main>
  <section class="toolbar">
    <div class="field"><label for="server">Chọn máy chủ</label><select id="server"></select></div>
    <div class="field"><label for="region">Region tự động nhận dạng</label><input id="region" value="VN" readonly></div>
    <button id="loadBtn">TẢI SỰ KIỆN</button>
  </section>
  <div id="status" class="status" role="status">Đang khởi tạo...</div>
  <div class="meta"><span class="pill" id="regionTag">Region: VN</span><span class="pill" id="updatedTag">Chưa cập nhật</span></div>
  <section><div class="section-title"><h2>🎯 Sự kiện</h2><span class="count" id="eventCount">0 mục</span></div><div class="grid" id="events"></div></section>
  <section><div class="section-title"><h2>📢 Thông báo</h2><span class="count" id="noticeCount">0 mục</span></div><div class="grid" id="notices"></div></section>
  <section><div class="section-title"><h2>🔄 Cập nhật cộng đồng</h2><span class="count" id="updateCount">0 mục</span></div><div class="grid" id="updates"></div></section>
</main>
<footer>FF Event Center • Dữ liệu được lấy từ dịch vụ sự kiện bên ngoài. Không phải website chính thức của Garena.</footer>
<script>
const SERVERS = [
  {name:"Việt Nam",code:"VN"},{name:"Singapore",code:"SG"},{name:"Indonesia",code:"ID"},
  {name:"Thái Lan",code:"TH"},{name:"Đài Loan",code:"TW"},{name:"Brazil",code:"BR"},
  {name:"Hoa Kỳ",code:"US"},{name:"Nam Mỹ",code:"SAC"},{name:"Bắc Mỹ",code:"NA"},
  {name:"Châu Âu",code:"EU"},{name:"Trung Đông",code:"ME"},{name:"Ấn Độ",code:"IND"},
  {name:"Pakistan",code:"PK"},{name:"Bangladesh",code:"BD"},{name:"Nga",code:"RU"},
  {name:"CIS",code:"CIS"}
];
const $ = id => document.getElementById(id);
const server = $("server"), region = $("region"), statusBox = $("status");
SERVERS.forEach(s => { const o=document.createElement("option"); o.value=s.code; o.textContent=`${s.name} (${s.code})`; server.append(o); });
function setStatus(message,kind=""){statusBox.textContent=message;statusBox.className="status "+kind;}
function dateLabel(value){if(!value)return "Thời gian chưa rõ";const d=new Date(Number(value)*1000);return Number.isNaN(d.getTime())?"":d.toLocaleString("vi-VN");}
function card(item){
  const article=document.createElement("article");article.className="event";
  if(item.banner){const img=document.createElement("img");img.src=item.banner;img.alt=item.title||"Banner sự kiện";img.loading="lazy";img.onerror=()=>img.style.display="none";article.append(img);}
  const body=document.createElement("div");body.className="event-body";
  const title=document.createElement("h3");title.textContent=item.title||"Chưa có tiêu đề";
  const time=document.createElement("small");time.textContent=`Bắt đầu: ${dateLabel(item.start)}${item.end?" · Kết thúc: "+dateLabel(item.end):""}`;
  body.append(title,time);
  const href=item.link||item.link_alt;
  if(href){try{const u=new URL(href);if(["https:","http:"].includes(u.protocol)){const a=document.createElement("a");a.href=u.href;a.target="_blank";a.rel="noopener noreferrer";a.textContent="Xem chi tiết ↗";body.append(a);}}catch{}}
  article.append(body);return article;
}
function renderList(id,items,countId){
  const target=$(id);target.replaceChildren();const safe=Array.isArray(items)?items:[];
  $(countId).textContent=`${safe.length} mục`;
  if(!safe.length){const e=document.createElement("div");e.className="empty";e.textContent="Chưa có dữ liệu cho khu vực này.";target.append(e);return;}
  safe.forEach(x=>target.append(card(x)));
}
async function loadEvents(){
  const code=server.value;region.value=code;$("regionTag").textContent=`Region: ${code}`;
  $("loadBtn").disabled=true;setStatus(`Đang tải dữ liệu máy chủ ${code}...`);
  try{
    const response=await fetch(`/api/events?region=${encodeURIComponent(code)}`,{headers:{Accept:"application/json"}});
    const data=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);
    if(data.status==="error")throw new Error(data.message||"API trả về lỗi.");
    renderList("events",data.events,$("eventCount").id);
    renderList("notices",data.notices,$("noticeCount").id);
    renderList("updates",data.updates,$("updateCount").id);
    $("updatedTag").textContent=data.timestamp?`Cập nhật: ${new Date(data.timestamp).toLocaleString("vi-VN")}`:"Đã tải dữ liệu";
    setStatus(`Tải dữ liệu ${data.region||code} thành công.`, "ok");
  }catch(err){
    setStatus(`Không thể tải dữ liệu: ${err.message}. Hãy kiểm tra cấu hình API hoặc thử lại.`, "error");
    renderList("events",[], "eventCount");renderList("notices",[],"noticeCount");renderList("updates",[],"updateCount");
  }finally{$("loadBtn").disabled=false;}
}
server.addEventListener("change",()=>{region.value=server.value;loadEvents();});
$("loadBtn").addEventListener("click",loadEvents);
loadEvents();
</script>
</body></html>
