<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FREE FIRE EVENT & UPDATE 🔥</title>

<style>
/* =====================================================
   GAR​​ENA FREE FIRE FONT
   ===================================================== */

@font-face{
    font-family:"GFF";
    src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Regular.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Regular.woff") format("woff");
    font-weight:400;
    font-style:normal;
    font-display:swap;
}

@font-face{
    font-family:"GFF";
    src:url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff2") format("woff2"),
        url("https://dl.dir.freefiremobile.com/common/web_event/common/fonts/website/GFFLatinW05-Bold.woff") format("woff");
    font-weight:700;
    font-style:normal;
    font-display:swap;
}

/* =====================================================
   TOÀN BỘ WEBSITE DÙNG GFF
   ===================================================== */

html,
body,
button,
input,
select,
option,
textarea,
a,
div,
span,
p,
h1,
h2,
h3,
h4,
h5,
h6,
strong,
b,
small{
    font-family:"GFF",sans-serif;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050505;
    color:#fff;
}

/* =====================================================
   ROOT
   ===================================================== */

:root{
    --orange:#ff6a00;
    --orange2:#ff9d00;
    --black:#050505;
    --card:#101010;
    --border:rgba(255,106,0,.22);
    --muted:#999;
    --green:#20df72;
    --red:#ff4545;
}

/* =====================================================
   HEADER
   ===================================================== */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:rgba(5,5,5,.92);
    backdrop-filter:blur(15px);

    border-bottom:1px solid var(--border);
}

.header-inner{
    width:min(1200px,calc(100% - 24px));
    min-height:64px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:42px;
    height:42px;
    border-radius:11px;
    object-fit:cover;
}

.logo span{
    font-weight:700;
    font-size:14px;
}

.nav{
    display:flex;
    gap:7px;
}

.nav a{
    color:#aaa;
    text-decoration:none;
    font-size:12px;
    padding:10px 12px;
    border-radius:9px;
}

.nav a:hover{
    color:#fff;
    background:rgba(255,106,0,.1);
}

.menu{
    display:none;

    border:1px solid var(--border);
    background:#111;
    color:#fff;

    width:40px;
    height:40px;
    border-radius:10px;

    font-size:19px;
}

/* =====================================================
   HERO
   ===================================================== */

.hero{
    width:min(1200px,calc(100% - 24px));
    margin:25px auto 18px;
}

.hero-box{
    padding:30px 24px;

    border-radius:20px;

    background:
        radial-gradient(
            circle at right,
            rgba(255,106,0,.15),
            transparent 35%
        ),
        #0d0d0d;

    border:1px solid var(--border);
}

.hero h1{
    margin:0;

    font-size:clamp(27px,6vw,55px);
    line-height:1.05;

    font-weight:700;
}

.hero h1 span{
    color:var(--orange);
}

.hero p{
    color:#999;
    margin:12px 0 0;
    font-size:13px;
}

/* =====================================================
   CONTROLS
   ===================================================== */

.controls{
    width:min(1200px,calc(100% - 24px));
    margin:auto;

    display:grid;
    grid-template-columns:220px 1fr;
    gap:10px;
}

select,
.search{
    width:100%;
    height:46px;

    border-radius:11px;
    border:1px solid var(--border);

    outline:none;

    background:#111;
    color:#fff;

    padding:0 13px;

    font-size:12px;
}

select option{
    background:#111;
    color:#fff;
}

select:focus,
.search:focus{
    border-color:var(--orange);
}

/* =====================================================
   FILTER
   ===================================================== */

.filters{
    width:min(1200px,calc(100% - 24px));
    margin:12px auto;

    display:flex;
    gap:7px;

    overflow-x:auto;
    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter{
    flex:none;

    padding:10px 14px;

    border-radius:9px;

    border:1px solid #222;
    background:#101010;

    color:#888;

    cursor:pointer;
    font-size:11px;
}

.filter.active{
    color:#fff;
    border-color:var(--orange);
    background:rgba(255,106,0,.12);
}

/* =====================================================
   INFO
   ===================================================== */

.info{
    width:min(1200px,calc(100% - 24px));
    margin:0 auto 14px;

    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.info span{
    padding:8px 11px;

    border-radius:8px;

    background:#101010;
    border:1px solid #1b1b1b;

    color:#999;
    font-size:10px;
}

.info strong{
    color:#fff;
}

#syncStatus{
    color:var(--green);
}

/* =====================================================
   EVENTS
   ===================================================== */

main{
    width:min(1200px,calc(100% - 24px));
    margin:auto;
    padding-bottom:50px;
}

.events{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

/* =====================================================
   CARD
   ===================================================== */

.card{
    overflow:hidden;

    background:var(--card);

    border:1px solid #1c1c1c;
    border-radius:16px;

    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:var(--border);
}

.banner{
    position:relative;
    aspect-ratio:16/9;

    background:#0b0b0b;
}

.banner img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:block;
}

.status{
    position:absolute;
    left:9px;
    top:9px;

    padding:6px 8px;

    border-radius:7px;

    font-size:9px;
    font-weight:700;

    background:rgba(0,0,0,.7);
}

.status.live{
    color:#32e779;
}

.status.upcoming{
    color:#ffb13b;
}

.status.ended{
    color:#999;
}

.copy{
    position:absolute;
    right:9px;
    top:9px;

    padding:6px 8px;

    border-radius:7px;

    border:1px solid rgba(255,255,255,.1);

    background:rgba(0,0,0,.7);
    color:#fff;

    cursor:pointer;
    font-size:9px;
}

.content{
    padding:13px;
}

.title{
    margin:0;

    font-size:16px;
    line-height:1.3;

    font-weight:700;
}

.vq{
    display:inline-block;

    margin-top:7px;
    padding:5px 7px;

    border-radius:6px;

    background:rgba(255,106,0,.08);
    border:1px solid rgba(255,106,0,.18);

    color:#ffae50;

    font-size:9px;
}

.description{
    margin:9px 0 0;

    color:#888;

    font-size:10px;
    line-height:1.5;
}

.meta{
    margin-top:12px;

    display:grid;
    gap:6px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;

    padding-bottom:6px;

    border-bottom:1px solid #191919;
}

.row span:first-child{
    color:#666;
}

.row span:last-child{
    color:#ccc;
    text-align:right;
}

.row span{
    font-size:9px;
}

.countdown{
    margin-top:10px;

    padding:9px;

    text-align:center;

    border-radius:8px;

    background:rgba(255,106,0,.06);
    color:#ffab49;

    font-size:10px;
}

/* =====================================================
   EMPTY / LOADING
   ===================================================== */

.message{
    grid-column:1/-1;

    padding:50px 20px;

    text-align:center;

    border:1px dashed #222;
    border-radius:16px;

    background:#0c0c0c;
}

.message-title{
    font-weight:700;
    font-size:16px;
}

.message-text{
    margin-top:7px;
    color:#666;
    font-size:10px;
}

/* =====================================================
   FOOTER
   ===================================================== */

footer{
    border-top:1px solid #161616;

    padding:25px 15px 35px;

    text-align:center;
}

footer strong{
    font-size:12px;
}

footer p{
    margin:7px 0 0;

    color:#555;
    font-size:9px;
}

/* =====================================================
   TOAST
   ===================================================== */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;

    transform:translate(-50%,20px);

    opacity:0;
    pointer-events:none;

    padding:10px 14px;

    background:#151515;
    border:1px solid var(--border);
    border-radius:9px;

    font-size:10px;

    transition:.2s;

    z-index:9999;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:800px){

    .nav{
        display:none;
    }

    .menu{
        display:block;
    }

    .controls{
        grid-template-columns:1fr;
    }

    .events{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:550px){

    .events{
        grid-template-columns:1fr;
    }

    .hero-box{
        padding:24px 18px;
    }

    .hero h1{
        font-size:30px;
    }

}
</style>

    </p>

<script>

/* =====================================================
   CONFIG
   ===================================================== */

const API =
    "/api/events?region=";

const DEFAULT_IMAGE =
    "https://img-ffvn-tgm-com.vercel.app/images/JZ15I6Yo.jpg";

const REFRESH_TIME =
    10000;

const TIMEOUT =
    15000;


/* =====================================================
   STATE
   ===================================================== */

let state = {

    server:
        localStorage.getItem("ff_server") ||
        "vn",

    events:[],

    filter:"all",

    search:"",

    loading:false

};


/* =====================================================
   ELEMENTS
   ===================================================== */

const serverEl =
    document.getElementById("server");

const listEl =
    document.getElementById("eventList");

const searchEl =
    document.getElementById("search");

const countEl =
    document.getElementById("count");

const serverNameEl =
    document.getElementById("serverName");

const syncEl =
    document.getElementById("syncStatus");

const toastEl =
    document.getElementById("toast");


serverEl.value =
    state.server;


/* =====================================================
   SERVER NAMES
   ===================================================== */

const SERVER_NAMES = {

    vn:"VN",
    th:"TH",
    id:"ID",
    sg:"SG",
    my:"MY",
    ph:"PH",
    br:"BR",
    in:"IN",
    pk:"PK",
    bd:"BD",
    eg:"EG"

};


/* =====================================================
   HTML ESCAPE
   ===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   API FETCH
   ===================================================== */

async function getAPI(server){

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            TIMEOUT
        );

    try{

        const url =
            API +
            encodeURIComponent(server) +
            "&_t=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store",
                    signal:controller.signal,
                    headers:{
                        Accept:"application/json",
                        "Cache-Control":"no-cache"
                    }
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        return await response.json();

    }finally{

        clearTimeout(timer);

    }

}


/* =====================================================
   FIND EVENTS
   ===================================================== */

function findEvents(data){

    if(!data)
        return [];

    if(Array.isArray(data))
        return data;

    if(Array.isArray(data.events))
        return data.events;

    if(
        data.data &&
        Array.isArray(data.data.events)
    )
        return data.data.events;

    if(
        data.data &&
        Array.isArray(data.data)
    )
        return data.data;

    return [];

}


/* =====================================================
   NORMALIZE
   ===================================================== */

function normalize(event,index){

    return {

        id:
            event.id ??
            event.event_id ??
            index,

        title:
            event.title ??
            event.name ??
            "Sự kiện Free Fire",

        banner:
            event.banner ??
            event.image ??
            event.img ??
            DEFAULT_IMAGE,

        start:
            event.start ??
            event.start_time ??
            "",

        end:
            event.end ??
            event.end_time ??
            "",

        link:
            event.link ??
            event.url ??
            "",

        type:
            event.type ??
            "",

        description:
            event.description ??
            event.desc ??
            event.content ??
            "",

        raw:event

    };

}


/* =====================================================
   DATE
   ===================================================== */

function date(value){

    if(!value)
        return null;

    const d =
        new Date(value);

    return isNaN(d.getTime())
        ? null
        : d;

}


/* =====================================================
   STATUS
   ===================================================== */

function getStatus(event){

    const now =
        Date.now();

    const start =
        date(event.start);

    const end =
        date(event.end);

    if(
        start &&
        now < start.getTime()
    )
        return "upcoming";

    if(
        end &&
        now > end.getTime()
    )
        return "ended";

    return "live";

}


/* =====================================================
   STATUS TEXT
   ===================================================== */

function statusText(status){

    if(status === "live")
        return "ĐANG DIỄN RA";

    if(status === "upcoming")
        return "SẮP DIỄN RA";

    return "ĐÃ KẾT THÚC";

}


/* =====================================================
   DATE FORMAT
   ===================================================== */

function formatDate(value){

    const d =
        date(value);

    if(!d)
        return "--";

    return d.toLocaleString(
        "vi-VN",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   COUNTDOWN
   ===================================================== */

function countdown(event){

    const status =
        getStatus(event);

    const target =
        status === "upcoming"
            ? date(event.start)
            : date(event.end);

    if(!target)
        return "THỜI GIAN CHƯA XÁC ĐỊNH";

    const diff =
        target.getTime() -
        Date.now();

    if(diff <= 0)
        return status === "upcoming"
            ? "ĐANG DIỄN RA"
            : "ĐÃ KẾT THÚC";

    let seconds =
        Math.floor(diff / 1000);

    const days =
        Math.floor(seconds / 86400);

    seconds %= 86400;

    const hours =
        Math.floor(seconds / 3600);

    seconds %= 3600;

    const minutes =
        Math.floor(seconds / 60);

    seconds %= 60;

    return (
        days +
        " NGÀY " +
        String(hours).padStart(2,"0") +
        ":" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0")
    );

}


/* =====================================================
   VQ
   ===================================================== */

const VQ = {

    TW:"VQTO",
    FW:"VQBM",
    DW:"VQKB",
    TG:"VQMM",
    LW:"BXNP",
    MS:"SHB"

};

function detectVQ(event){

    const raw =
        event.raw || {};

    const text = [

        event.title,
        event.type,

        raw.title,
        raw.type,
        raw.id,
        raw.event_id,
        raw.code,
        raw.name

    ]
    .filter(Boolean)
    .join(" ")
    .toUpperCase();

    for(
        const prefix in VQ
    ){

        const regex =
            new RegExp(
                "\\b" +
                prefix +
                "(10|[1-9])\\b"
            );

        const match =
            text.match(regex);

        if(match){

            return (
                VQ[prefix] +
                match[1]
            );

        }

    }

    return "";

}


/* =====================================================
   FILTER
   ===================================================== */

function visibleEvents(){

    let events =
        [...state.events];

    if(
        state.filter !== "all"
    ){

        events =
            events.filter(
                event =>
                    getStatus(event) ===
                    state.filter
            );

    }

    if(state.search){

        const q =
            state.search
                .toLowerCase()
                .trim();

        events =
            events.filter(
                event =>
                    (
                        event.title +
                        " " +
                        event.description +
                        " " +
                        event.type
                    )
                    .toLowerCase()
                    .includes(q)
            );

    }

    return events;

}


/* =====================================================
   RENDER
   ===================================================== */

function render(){

    const events =
        visibleEvents();

    countEl.textContent =
        events.length;

    if(!events.length){

        listEl.innerHTML = `

            <div class="message">

                <div class="message-title">
                    KHÔNG CÓ SỰ KIỆN
                </div>

                <div class="message-text">
                    Chưa tìm thấy sự kiện phù hợp.
                </div>

            </div>

        `;

        return;

    }

    listEl.innerHTML =
        events.map(
            event => {

                const status =
                    getStatus(event);

                const vq =
                    detectVQ(event);

                return `

                <article class="card">

                    <div class="banner">

                        <img
                            src="${escapeHTML(event.banner || DEFAULT_IMAGE)}"
                            alt="${escapeHTML(event.title)}"
                            onerror="
                                this.onerror=null;
                                this.src='${DEFAULT_IMAGE}';
                            "
                        >

                        <div class="status ${status}">
                            ${statusText(status)}
                        </div>

                        <button
                            class="copy"
                            data-copy="${encodeURIComponent(event.banner || "")}"
                        >
                            SAO CHÉP
                        </button>

                    </div>

                    <div class="content">

                        <h2 class="title">
                            ${escapeHTML(event.title)}
                        </h2>

                        ${
                            vq
                                ? `
                                <div class="vq">
                                    ${escapeHTML(vq)}
                                </div>
                                `
                                : ""
                        }

                        ${
                            event.description
                                ? `
                                <p class="description">
                                    ${escapeHTML(event.description)}
                                </p>
                                `
                                : ""
                        }

                        <div class="meta">

                            <div class="row">
                                <span>BẮT ĐẦU</span>
                                <span>
                                    ${escapeHTML(
                                        formatDate(event.start)
                                    )}
                                </span>
                            </div>

                            <div class="row">
                                <span>KẾT THÚC</span>
                                <span>
                                    ${escapeHTML(
                                        formatDate(event.end)
                                    )}
                                </span>
                            </div>

                        </div>

                        <div
                            class="countdown"
                            data-id="${escapeHTML(event.id)}"
                        >
                            ${countdown(event)}
                        </div>

                    </div>

                </article>

                `;

            }
        )
        .join("");

}


/* =====================================================
   LOAD
   ===================================================== */

async function load(){

    if(state.loading)
        return;

    state.loading = true;

    syncEl.textContent =
        "ĐANG CẬP NHẬT";

    try{

        const data =
            await getAPI(
                state.server
            );

        const raw =
            findEvents(data);

        state.events =
            raw.map(normalize);

        render();

        syncEl.textContent =
            "ĐÃ ĐỒNG BỘ";

        localStorage.setItem(
            "ff_server",
            state.server
        );

    }catch(error){

        console.error(error);

        syncEl.textContent =
            "LỖI KẾT NỐI";

        if(!state.events.length){

            listEl.innerHTML = `

                <div class="message">

                    <div class="message-title">
                        ĐANG CẬP NHẬT
                    </div>

                    <div class="message-text">
                        Không thể tải dữ liệu sự kiện.
                    </div>

                </div>

            `;

        }

    }finally{

        state.loading = false;

    }

}


/* =====================================================
   SERVER CHANGE
   ===================================================== */

serverEl.addEventListener(
    "change",
    () => {

        state.server =
            serverEl.value;

        state.events = [];

        state.filter =
            "all";

        document
            .querySelectorAll(".filter")
            .forEach(
                button =>
                    button.classList.remove("active")
            );

        document
            .querySelector(
                '[data-filter="all"]'
            )
            .classList.add("active");

        serverNameEl.textContent =
            SERVER_NAMES[state.server];

        load();

    }
);


/* =====================================================
   SEARCH
   ===================================================== */

searchEl.addEventListener(
    "input",
    event => {

        state.search =
            event.target.value;

        render();

    }
);


/* =====================================================
   FILTER BUTTONS
   ===================================================== */

document
    .querySelectorAll(".filter")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".filter")
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );

                    button.classList.add(
                        "active"
                    );

                    state.filter =
                        button.dataset.filter;

                    render();

                }
            );

        }
    );


/* =====================================================
   COPY
   ===================================================== */

document.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                ".copy"
            );

        if(!button)
            return;

        const url =
            decodeURIComponent(
                button.dataset.copy || ""
            );

        if(!url){

            showToast(
                "Không có link banner"
            );

            return;

        }

        try{

            await navigator.clipboard.writeText(
                url
            );

            showToast(
                "ĐÃ SAO CHÉP LINK BANNER"
            );

        }catch{

            showToast(
                "KHÔNG THỂ SAO CHÉP"
            );

        }

    }
);


/* =====================================================
   TOAST
   ===================================================== */

let toastTimer;

function showToast(message){

    toastEl.textContent =
        message;

    toastEl.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {
                toastEl.classList.remove(
                    "show"
                );
            },
            2000
        );

}


/* =====================================================
   COUNTDOWN UPDATE
   ===================================================== */

setInterval(
    () => {

        document
            .querySelectorAll(
                ".countdown"
            )
            .forEach(
                element => {

                    const id =
                        element.dataset.id;

                    const event =
                        state.events.find(
                            item =>
                                String(item.id) ===
                                String(id)
                        );

                    if(event){

                        element.textContent =
                            countdown(event);

                    }

                }
            );

    },
    1000
);


/* =====================================================
   AUTO REFRESH 24/24
   ===================================================== */

setInterval(
    () => {

        if(
            navigator.onLine &&
            document.visibilityState ===
            "visible"
        ){

            load();

        }

    },
    REFRESH_TIME
);


/* =====================================================
   TAB / APP QUAY LẠI
   ===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            load();

        }

    }
);

window.addEventListener(
    "focus",
    load
);

window.addEventListener(
    "online",
    load
);


/* =====================================================
   MOBILE MENU
   ===================================================== */

document
    .getElementById("menuBtn")
    .addEventListener(
        "click",
        () => {

            const nav =
                document.querySelector(".nav");

            if(
                getComputedStyle(nav).display ===
                "none"
            ){

                nav.style.display =
                    "flex";

                nav.style.position =
                    "absolute";

                nav.style.top =
                    "64px";

                nav.style.right =
                    "12px";

                nav.style.flexDirection =
                    "column";

                nav.style.background =
                    "#101010";

                nav.style.padding =
                    "8px";

                nav.style.border =
                    "1px solid #222";

                nav.style.borderRadius =
                    "12px";

            }else{

                nav.removeAttribute(
                    "style"
                );

            }

        }
    );


/* =====================================================
   INIT
   ===================================================== */

serverNameEl.textContent =
    SERVER_NAMES[state.server];

load();

</script>

</body>
     </html>
